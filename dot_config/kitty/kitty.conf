# ==========================================
# Shell & System
# ==========================================
# 環境変数に依存しないフルパス指定に変更
shell /opt/homebrew/bin/fish --login
macos_quit_when_last_window_closed yes

# ==========================================
# Keyboard Shortcuts
# ==========================================
# カレントディレクトリを引き継いで新しいタブを開く
map cmd+t new_tab_with_cwd

# ==========================================
# Font
# ==========================================
font_family      JetBrainsMono Nerd Font Medium
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        13.0
line_spacing     3

# ==========================================
# Background & Effects (省メモリのため無効化)
# ==========================================
# background_opacity      0.92
# macos_background_blur   20

# ==========================================
# Tab Bar
# ==========================================
tab_bar_edge            top
tab_bar_min_tabs        1

# スタイルを custom に変更（矢印などの動的パーツを排除）
tab_bar_style           custom
tab_separator           ""

# シェル統合機能のうち「実行中コマンド名でタイトルを書き換える」機能を無効化
shell_integration no-title

# cwdのbasenameのみを使う（実行コマンド名を無視）
tab_title_template "{tab.active_wd.split('/')[-1]}"
active_tab_title_template "{tab.active_wd.split('/')[-1]}"

# シンボル類のON/OFFによる1〜2セルのズレを消す
tab_activity_symbol none
bell_on_tab no

# タブバーの背景色
tab_bar_background      #181818

# アクティブなタブ（ハッキリ見えるグレー背景に白文字）
active_tab_foreground   #ffffff
active_tab_background   #2d3139
active_tab_font_style   bold

# 非アクティブなタブ（背景に溶け込ませて存在感を消す）
inactive_tab_foreground #7f848e
inactive_tab_background #181818
inactive_tab_font_style normal

# ==========================================
# Performance & Memory Optimization
# ==========================================
scrollback_lines        1000

# ==========================================
# Theme
# ==========================================
background            #181818
foreground            #cccccc
cursor                #aeafad
selection_background  #264f78
selection_foreground  #ffffff

# 16 ANSI Colors
color0  #000000
color1  #cd3131
color2  #0dbc79
color3  #e5e510
color4  #2472c8
color5  #bc3fbc
color6  #11a8cd
color7  #e5e5e5
color8  #666666
color9  #f14c4c
color10 #23d18b
color11 #f5f543
color12 #3b8eea
color13 #d670d6
color14 #29b8db
color15 #ffffff
